<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road Strip Diagram Tool</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#111827;--mu:#6b7280;--ln:#d1d5db;--ac:#2563eb;--bl:#1d4ed8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2027;--tx:#e5e7eb;--mu:#9ca3af;--ln:#374151;--ac:#60a5fa;--bl:#93c5fd}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2027;--tx:#e5e7eb;--mu:#9ca3af;--ln:#374151;--ac:#60a5fa;--bl:#93c5fd}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;gap:12px;padding:12px;align-items:flex-start}
.panel{width:330px;flex:none;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.view{flex:1;min-width:0;background:var(--card);border:1px solid var(--ln);border-radius:10px;overflow:auto;max-height:calc(100vh - 24px)}
h1{font-size:16px;margin:0 0 8px}h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin:14px 0 6px}
h3{font-size:12px;font-weight:600;margin:10px 0 4px}
label{display:block;font-size:12px;color:var(--mu);margin-top:6px}
input,select,textarea,button{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:6px 8px}
textarea{height:70px;font-size:12px}
.r{display:flex;gap:6px}.r>*{flex:1}
.r label{display:flex;align-items:center;gap:5px}
input[type=checkbox]{width:auto;margin:0}
button{cursor:pointer;background:var(--ac);color:#fff;border:0;margin-top:8px}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--ln);margin-top:4px}
#msg{color:#dc2626;font-size:12px;min-height:16px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:3px 2px;border-bottom:1px solid var(--ln);text-align:left}th{position:sticky;top:0;background:var(--card);z-index:1}
td.x{cursor:pointer;color:#dc2626;text-align:right;width:18px}
.list{max-height:260px;overflow:auto}
.fl{display:flex;min-width:min-content}.hd{position:sticky;left:0;flex:none;background:var(--card);z-index:2;border-right:1px solid var(--ln)}
svg text{fill:var(--tx);font-family:inherit}
.hide{display:none!important}
.footer{text-align:right;color:var(--mu);font-size:12px;padding:4px 12px 12px}
.hint{font-size:11px;color:var(--mu);margin:4px 0;white-space:pre-wrap;font-family:inherit}
.point-label-option{display:flex;align-items:center;gap:6px;padding:2px 0}
.point-label-option input{flex:none}
.drag-label{cursor:move;touch-action:none;user-select:none}
.legend-title{font-size:12px;font-weight:700}
#printPages{display:none}
@media(max-width:800px){.app{flex-direction:column}.panel{width:100%;position:static;max-height:none}.view{max-height:70vh;width:100%}}
@page{size:A3 landscape;margin:10mm}
@media print{
 body{background:#fff;color:#111}
 #printPages{--tx:#111}
 .panel,.view,.footer{display:none!important}
 .app{display:none}
 #printPages{display:block}
 .printPage{height:277mm;position:relative;page-break-after:always;break-after:page;overflow:hidden}
 .printPage:last-child{page-break-after:auto;break-after:auto}
 .printChart{display:flex;align-items:flex-start;width:100%;max-height:258mm;overflow:hidden}
 .printChart svg{max-height:258mm;max-width:100%;height:auto;flex:none}
 .printNumber{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:10pt}
}
</style></head><body>
<div class="app">
<div class="panel">
<h1>Road Strip Diagram</h1>
<h2>1. INPUT</h2>
<label>Road Name/Number</label><input id="title" value="PR 2718">
<label>Main category</label><select id="group"><option>Boundary</option><option>Existing</option><option>Design</option></select>
<div id="categoryField"><label>Category</label><select id="cat"></select></div>
<div id="customCategory" class="hide">
 <label>New category name</label><input id="customName" placeholder="e.g. Drainage">
 <label>Item type</label><select id="customMode"><option value="range">Range</option><option value="point">Point</option></select>
 <button class="s" id="customAdd">Add category</button>
</div>
<div class="r"><div><label>Start station</label><input id="s" placeholder="12+500 or 12500"></div>
<div id="eW"><label>End station</label><input id="e" placeholder="15+000"></div></div>
<label id="vL">Value</label><select id="v"></select>
<label id="vOtherLabel" class="hide">Custom value</label><input id="vOther" class="hide">
<div id="landmarkFields" class="hide">
 <label>Importance</label><div class="r"><label><input id="landmarkMajor" type="checkbox" checked> Major</label><label><input id="landmarkMinor" type="checkbox"> Minor</label></div>
 <div id="landmarkCustom" class="hide">
   <label>Landmark name</label><input id="landmarkName" placeholder="Other landmark">
   <label>Optional symbol image (SVG, PNG, JPG)</label><input type="file" id="landmarkSymbol" accept=".svg,.png,.jpg,.jpeg,image/svg+xml,image/png,image/jpeg">
  </div>
 </div>
 <div id="dimensionBox" class="hide"><label id="dimensionLabel">Dimension (optional)</label><input id="dimension" placeholder="e.g. 1.2 x 1.0 m"></div>
 <div id="drainCustomBox" class="hide">
  <label>Optional side drain symbol (SVG, PNG, JPG)</label><input type="file" id="drainSymbol" accept=".svg,.png,.jpg,.jpeg,image/svg+xml,image/png,image/jpeg">
</div>
<button id="add">Add to diagram</button><div id="msg"></div>
<h3>Paste from Excel</h3>
<label for="excelPaste">Copy the rows for one category from Excel and paste them here.</label>
<textarea id="excelPaste"></textarea>
<button class="s" id="imp">Add pasted rows</button>
<h2>2. VIEW</h2>
<label>Scale: <span id="sc"></span> m per pixel (smaller = zoom in, wider)</label>
<input type="range" id="scale" min="2" max="200" value="40">
<h3>Labels</h3>
<div id="pointLabels"></div>
<p class="hint">Drag diagram labels to reposition them.</p>
<button class="s" id="rst">Reset sample</button>
<h2>Items <span id="cnt"></span></h2>
<div class="list"><table id="tb"></table></div>
<button class="s" id="clr">Clear selected category</button>
<h2>3. EXPORT</h2>
<div class="r"><button class="s" id="pdf">PDF</button><button class="s" id="jpg">JPG</button></div>
<p class="hint">PDF opens the print dialog (A3 landscape); choose Save as PDF.</p>
</div>
<div class="view" id="view"><div class="fl"><div class="hd" id="hd"></div><div id="bd"></div></div></div>
</div>
<div class="footer">By Mr.SOPHAL Ratitya</div>
<div id="printPages"></div>

const decodedSymbols=new Map();
async function inlineSymbol(name){
 if(name.startsWith('data:'))return name;
 const file=decodeURIComponent(name.startsWith('symbols/')?name.slice(8):name);
 if(decodedSymbols.has(file))return decodedSymbols.get(file);
 const response=await fetch(new URL(`symbols/${encodeURIComponent(file)}`,location.href),{cache:'no-store'});
 if(!response.ok)throw Error(`Unable to load symbol for JPG export: ${file}`);
 const svg=await response.text(),uri=`data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
 decodedSymbols.set(file,uri);return uri
}
async function standaloneSvg(svg){
 const clone=svg.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
 clone.innerHTML=clone.innerHTML.replace(/var\(--ln\)/g,'#d1d5db').replace(/var\(--bl\)/g,'#1d4ed8').replace(/var\(--mu\)/g,'#6b7280').replace(/var\(--tx\)/g,'#111827').replace(/var\(--card\)/g,'#ffffff');
 await Promise.all([...clone.querySelectorAll('image')].map(async image=>{const href=image.getAttribute('href');if(href&&!href.startsWith('data:'))image.setAttribute('href',await inlineSymbol(href))}));
 return new XMLSerializer().serializeToString(clone)
}

$('jpg').onclick=async()=>{
 const count=exportPages(),pages=[...$('printPages').children],roadName=($('title').value||'Road').trim().replace(/[<>:"/\\|?*\u0000-\u001f]+/g,'-').replace(/[. ]+$/g,'')||'Road',base=`${roadName}_Diagram`;
 decodedSymbols.clear();
 $('msg').textContent='Preparing JPG export…';
 try{
  for(let i=0;i<count;i++){
   const svgs=await Promise.all([...pages[i].querySelectorAll('svg')].map(standaloneSvg)),imgs=await Promise.all(svgs.map(source=>new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(new Blob([source],{type:'image/svg+xml'}));img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Unable to render a symbol for JPG export'))};img.src=url})));
   const height=imgs[0].height,width=imgs.reduce((sum,img)=>sum+img.width,0),canvas=document.createElement('canvas');canvas.width=width*2;canvas.height=(height+36)*2;
   const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);let x=0;
   imgs.forEach(img=>{ctx.drawImage(img,x,0,img.width*2,height*2);x+=img.width*2});
   ctx.fillStyle='#111';ctx.font='24px sans-serif';ctx.textAlign='center';ctx.fillText(`Page ${i+1} of ${count}`,canvas.width/2,canvas.height-12);
   const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.92));if(!blob)throw Error('Could not create JPG image');
   const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`${base}_Page${i+1}.jpg`;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)
  }
  $('msg').textContent=`Exported ${count} JPG page(s)`
 }catch(e){$('msg').textContent='JPG export failed: '+e.message}
};
